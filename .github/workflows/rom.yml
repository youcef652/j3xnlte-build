name: LineageOS 15.1 FULL BUILD J3XNLTE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Free Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/lib/android

      - name: Install packages
        run: |
          sudo apt update
          sudo apt install -y git curl bc bison build-essential ccache \
          flex g++-multilib gcc-multilib gperf \
          lib32ncurses5-dev lib32z1-dev liblz4-tool \
          libncurses5-dev libssl-dev zip rsync \
          openjdk-8-jdk python-is-python3

      - name: Install repo
        run: |
          mkdir -p ~/bin
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o ~/bin/repo
          chmod +x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Init Source
        run: |
          mkdir lineage
          cd lineage
          repo init -u https://github.com/LineageOS/android.git -b lineage-15.1 --depth=1

      - name: Clean manifests
        run: |
          cd lineage
          rm -rf .repo/local_manifests
          mkdir -p .repo/local_manifests

      # ---------------- MANIFEST FIX ----------------
      - name: Add Manifest (FIXED)
        run: |
          cd lineage

          cat > .repo/local_manifests/j3xnlte.xml << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>

          <manifest>

          ```
          <project path="external/busybox"
                  name="omnirom/android_external_busybox"
                  revision="android-8.1" />

          <project path="bootable/recovery-twrp"
                  name="omnirom/android_bootable_recovery"
                  revision="android-8.1" />

          <project path="hardware/samsung"
                  name="LineageOS/android_hardware_samsung"
                  revision="lineage-15.1" />

          <project path="external/sony/boringssl-compat"
                  name="LineageOS/android_external_sony_boringssl-compat"
                  revision="lineage-15.1" />

          <project path="device/samsung/j3xlte"
                  name="djeman/android_device_samsung_j3xlte"
                  revision="lineage-15.1" />

          <project path="device/samsung/j3xnlte"
                  name="djeman/android_device_samsung_j3xnlte"
                  revision="lineage-15.1" />

          <project path="kernel/samsung/sharkls-common"
                  name="djeman/android_kernel_samsung_sharkls-common"
                  revision="lineage-15.1" />

          <project path="kernel/samsung/sharkls"
                  name="djeman/android_kernel_samsung_sharkls"
                  revision="lineage-15.1" />

          <project path="vendor/samsung/common"
                  name="djeman/android_vendor_samsung_common"
                  revision="lineage-15.1" />

          <project path="vendor/sprd"
                  name="djeman/android_vendor_sprd"
                  revision="lineage-15.1" />
          ```

          </manifest>
          EOF


      - name: Repo Sync
        run: |
          cd lineage
          repo sync -c --force-sync --no-tags --no-clone-bundle -j1 --retry-fetches=10

      - name: Fix Missing SCX35L Proprietaries
        run: |
          cd lineage

          mkdir -p vendor/sprd/proprietaries

          cat > vendor/sprd/proprietaries/proprietaries-scx35l.mk << 'EOF'
          #
          # Temporary SCX35L proprietary file
          #
          EOF

      # ---------------- FULL DEBUG ----------------
      - name: Debug Trees
        run: |
          cd lineage

          echo "===== DEVICE TREE ====="
          ls -la device/samsung || true

          echo "===== SHARKLS COMMON ====="
          ls -la device/samsung/sharkls-common || true

          echo "===== SHARKLS MK ====="
          find device/samsung/sharkls-common -name "sharkls.mk" || true

          echo "===== VENDOR SPRD ====="
          ls -la vendor/sprd || true

          echo "===== SCX35L CHECK ====="
          find vendor/sprd -name "*scx35l*" || true

          echo "===== DEPENDENCIES CHECK ====="
          grep -n "sharkls-common" device/samsung/j3xnlte/j3xnlte.mk || true

      - name: Setup Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          
      - name: Fix RIL Duplicate Build
        run: |
          cd lineage
          mkdir -p hardware/ril
          echo " " > hardware/ril/Android.mk

      - name: Build ROM
        run: |
          cd lineage
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true

          lunch lineage_j3xnlte-userdebug
          mka bacon -j2
      - name: Upload ROM
        uses: actions/upload-artifact@v4
        with:
          name: LineageOS-15.1-J3XNLTE
          path: lineage/out/target/product/j3xnlte/*.zip
