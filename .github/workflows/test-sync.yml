name: Test J3XNLTE Sync

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-22.04

    steps:
      - name: Free Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/lib/android
          df -h

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y git curl

      - name: Install Repo Tool
        run: |
          mkdir -p ~/bin
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o ~/bin/repo
          chmod +x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Init LineageOS
        run: |
          mkdir lineage
          cd lineage
          repo init -u https://github.com/LineageOS/android.git -b lineage-15.1

      - name: Add Local Manifest
        run: |
          cd lineage
          mkdir -p .repo/local_manifests

          cat > .repo/local_manifests/j3xnlte.xml << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>

            <project path="external/busybox"
                     name="omnirom/android_external_busybox"
                     revision="android-8.1" />

            <project path="bootable/recovery-twrp"
                     name="omnirom/android_bootable_recovery"
                     revision="android-8.1" />

            <project path="hardware/samsung"
                     name="LineageOS/android_hardware_samsung"
                     revision="lineage-15.1" />

            <project path="external/sony/boringssl-compat"
                     name="LineageOS/android_external_sony_boringssl-compat"
                     revision="lineage-15.1" />

            <project path="device/samsung/j3xlte"
                     name="djeman/android_device_samsung_j3xlte"
                     revision="lineage-15.1" />

            <project path="device/samsung/j3xnlte"
                     name="djeman/android_device_samsung_j3xnlte"
                     revision="lineage-15.1" />

            <project path="kernel/samsung/sharkls"
                     name="djeman/android_kernel_samsung_sharkls"
                     revision="lineage-15.1" />

            <project path="vendor/samsung/common"
                     name="djeman/android_vendor_samsung_common"
                     revision="lineage-15.1" />

          </manifest>
          EOF

      - name: Repo Sync
        run: |
          cd lineage
          repo sync -c -j1 --force-sync --retry-fetches=10

      - name: Disk Usage
        if: always()
        run: |
          df -h